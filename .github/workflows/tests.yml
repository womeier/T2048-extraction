name: E2E tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build the web bundle
    # The bundle (index.html, index.js, t2048.wasm) is platform-independent:
    # the Wasm module CertiRocq emits is the same everywhere. So it is built
    # once, here, and every e2e job below tests that one artifact — the
    # runners differ in their browsers, not in the code under test. Built on
    # x86_64-linux because that is the platform the public Rocq caches cover,
    # which keeps compcert and certirocq out of the critical path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # The public Rocq caches carry compcert and certirocq for
      # x86_64-linux, which is why the bundle is built on this platform.
      # They can lag a nixpkgs bump though, so what this job builds also
      # goes to the womeier cache, and the next run substitutes it from
      # there. Without a token (pull requests from forks) every cache stays
      # read-only and the job still works.
      - uses: cachix/cachix-action@v17
        with:
          name: womeier
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: coq-community,coq

      # compcert and certirocq are the expensive part of this build and are
      # never compiled in CI: --max-jobs 0 forbids building locally, so this
      # either fetches them from a cache above (compcert is propagated, so
      # the one fetch covers both) or fails right here — a clear failure in
      # seconds beats an hour of compiling CompCert. If it does fail, the
      # caches have not caught up with flake.lock yet: build it once
      # somewhere with the toolchain and `cachix push womeier ./result`.
      - name: Fetch compcert and certirocq, never build them
        run: nix build -L --no-link --max-jobs 0 .#CertiRocq

      - name: Build the bundle
        run: |
          out=$(nix build -L --no-link --print-out-paths .#t2048-web)
          mkdir -p bundle
          cp "$out"/index.html "$out"/index.js "$out"/t2048.wasm bundle/

      - uses: actions/upload-artifact@v4
        with:
          name: t2048-web
          path: bundle/
          if-no-files-found: error

  e2e:
    name: e2e — ${{ matrix.system }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # one runner per platform the flake builds for; macos-15-intel is
        # the Intel macOS runner (x86_64-darwin), which nixpkgs only still
        # supports on the 26.05 branch the flake pins for that system.
        #
        # develop-flags are extra flags for the `nix develop` call below,
        # and only x86_64-darwin needs any. `nix develop` runs the env
        # script it generates with the bashInteractive of the *flake's own*
        # locked `nixpkgs` input (the registry is not consulted), so on that
        # system it asks nixpkgs-unstable for a bash and gets an error back:
        # "Nixpkgs 26.11 has dropped support for x86_64-darwin". nix reports
        # that only as `error (ignored)` and falls back to the `bash` in
        # PATH, i.e. the system bash 3.2, which cannot parse its script
        # (`;&`, a bash 4 construct) — the failure this flag prevents.
        # Pointing the input at the branch the flake already uses for the
        # system gives the lookup a bash 5 to find; nothing else changes,
        # since the x86_64-darwin outputs build from nixpkgs-x86_64-darwin
        # and never read this input.
        include:
          - runs-on: ubuntu-latest
            system: x86_64-linux
            develop-flags: ''
          - runs-on: ubuntu-24.04-arm
            system: aarch64-linux
            develop-flags: ''
          - runs-on: macos-latest
            system: aarch64-darwin
            develop-flags: ''
          - runs-on: macos-15-intel
            system: x86_64-darwin
            develop-flags: '--override-input nixpkgs github:NixOS/nixpkgs/nixpkgs-26.05-darwin'
    runs-on: ${{ matrix.runs-on }}
    steps:
      # for tests/: the Playwright suite and its config
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: t2048-web
          path: bundle

      - name: Run the full e2e suite on ${{ matrix.system }}
        # The e2e shell is the Playwright runner, its browsers and python —
        # no Rocq toolchain, so this job builds none of the project; it
        # tests the bundle from the build job above. The line reporter
        # streams the platform, the browsers and the per-test results into
        # the job log.
        #   quick suite by hand (chromium only, what `nix flake check` runs):
        #   nix build -L .#checks.${{ matrix.system }}.t2048-e2e
        env:
          T2048_APP_DIR: ${{ github.workspace }}/bundle
        run: nix develop -L ${{ matrix.develop-flags }} .#e2e -c sh -c 'cd tests && playwright test --reporter=line'

  # Windows, the one platform that cannot go through the flake: nix has no
  # native Windows support, so this job builds its environment the ordinary
  # way — node and python from the runner image, the Playwright runner from
  # npm (pinned to 1.63.0 in tests/package.json, the version nixpkgs ships)
  # — and drives the Edge the image already has. It tests the very same
  # bundle as the jobs above. What it gives up is their reproducibility:
  # Edge's version floats with the runner image, and the runner comes from
  # the npm registry rather than from flake.lock.
  e2e-windows:
    name: e2e — windows (Edge)
    needs: build
    runs-on: windows-latest
    steps:
      # for tests/: the Playwright suite, its config and package.json
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22          # the version the dev shell has

      # for the webServer of the Playwright config: python -m http.server
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/download-artifact@v4
        with:
          name: t2048-web
          path: bundle

      - name: Install the Playwright runner
        working-directory: tests
        # No browsers are downloaded: the msedge project is a channel, i.e.
        # the Edge installed on the machine, so the runner is all that is
        # needed here.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: npm install --no-audit --no-fund

      - name: Run the Edge project on windows
        working-directory: tests
        env:
          T2048_APP_DIR: ${{ github.workspace }}\bundle
        run: npx playwright test --project=msedge --reporter=line
