name: E2E tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: e2e — ${{ matrix.system }}
    # also lets the dev-shell step below test for the token's presence
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        # one runner per platform the flake builds for; macos-15-intel is
        # the Intel macOS runner (x86_64-darwin), which nixpkgs only still
        # supports on the 26.05 branch the flake pins for that system
        include:
          - runs-on: ubuntu-latest
            system: x86_64-linux
          - runs-on: ubuntu-24.04-arm
            system: aarch64-linux
          - runs-on: macos-latest
            system: aarch64-darwin
          - runs-on: macos-15-intel
            system: x86_64-darwin
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # Push what this job builds to the womeier cache, so the next run
      # substitutes it — in particular compcert and certirocq, which only
      # x86_64-linux gets from coq-community. Without a token (pull
      # requests from forks) both caches stay read-only for pulling and
      # the job still works.
      - uses: cachix/cachix-action@v17
        with:
          name: womeier
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # the public Rocq caches, for what they do cover
          extraPullNames: coq-community,coq

      # The daemon above pushes what the job builds, which covers the
      # build closure but not the dev shell: coq-lsp, playwright-test and
      # the rest of `nix develop` are never built here. Realise the shell
      # into a profile and push that closure too, so a contributor with
      # the womeier cache configured gets the whole environment
      # substituted. Skipped without a token (pull requests from forks).
      - name: Cache the dev shell closure
        if: env.CACHIX_AUTH_TOKEN != ''
        run: |
          nix develop --profile dev-profile -c true
          cachix push womeier dev-profile

      - name: Run the full e2e suite on ${{ matrix.system }}
        # -L streams the run; the cat repeats the report at the end of the
        # job log, so the platform, the browsers and the per-test results
        # are the last thing in it
        run: |
          out=$(nix build -L --no-link --print-out-paths .#t2048-e2e-full)
          cat "$out/report"
        # quick suite (chromium only, what `nix flake check` runs):
        #   nix build -L .#checks.${{ matrix.system }}.t2048-e2e
