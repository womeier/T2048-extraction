name: E2E tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: e2e — ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        # one runner per platform the flake builds for; macos-15-intel is
        # the Intel macOS runner (x86_64-darwin), which nixpkgs only still
        # supports on the 26.05 branch the flake pins for that system
        include:
          - runs-on: ubuntu-latest
            system: x86_64-linux
          - runs-on: ubuntu-24.04-arm
            system: aarch64-linux
          - runs-on: macos-latest
            system: aarch64-darwin
          - runs-on: macos-15-intel
            system: x86_64-darwin
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://womeier.cachix.org https://coq-community.cachix.org https://coq.cachix.org
            extra-trusted-public-keys = womeier.cachix.org-1:0R8+V2ZDOk7mKAA+hF2VulnUoM3Qh8jmeDkcV8gw2Rs= coq-community.cachix.org-1:WBDHojv8FM6nI4ZMh43X+2g6j4WpAn+dFhjhWmLCgnA= coq.cachix.org-1:5QW/wwEnD+l2jvN6QRbRRsa4hBHG3QiQQ26cxu1F5tI=

      # Push what this job builds to the womeier cache, so the next run
      # In particular compcert and certirocq
      # stays read-only, as configured above, and the job still works.
      - uses: cachix/cachix-action@v17
        with:
          name: womeier
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run the full e2e suite on ${{ matrix.system }}
        # -L streams the run; the cat repeats the report at the end of the
        # job log, so the platform, the browsers and the per-test results
        # are the last thing in it
        run: |
          out=$(nix build -L --no-link --print-out-paths .#t2048-e2e-full)
          cat "$out/report"
        # quick suite (chromium only, what `nix flake check` runs):
        #   nix build -L .#checks.${{ matrix.system }}.t2048-e2e
